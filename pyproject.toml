[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "advernue"
version = "0.1.0"
description = "Official Python SDK for Advernue: one unified REST API over ~200 ad platforms."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["httpx>=0.25"]
keywords = ["advertising", "ads", "api", "sdk", "advernue"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10"]

[project.urls]
Homepage = "https://advernue.com"

[tool.hatch.build.targets.wheel]
packages = ["src/advernue"]

[tool.ruff]
line-length = 130
extend-exclude = ["src/advernue/_generated"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"scripts/*" = ["E501"]

[tool.mypy]
strict = true
files = ["src/advernue"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
